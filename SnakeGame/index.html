<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div id="infos">
                <div class="info">
                    <h1>High Score : 
                        <span id="high-score">0</span>
                    </h1>
                </div>
                <div class="info">
                    <h1>Score : 
                        <span id="score">0</span>
                    </h1>
                </div>
                <div class="info">
                    <h1>Time: 
                        <span id="time">00:00</span>
                    </h1>
                </div>
            </div>

            <div id="board"></div>
        </section>
        <div class="modal">
            <div class="start-game">
                <h3>Welcome to the Snake Game!!</h3>
                <button class="btn start-btn">Start Game</button>
            </div>
            <div class="game-over">
                <h3>Game Over 👀</h3>
                <button class="btn restart-btn">Re-Start Game</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
