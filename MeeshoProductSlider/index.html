<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Product Slider</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="containor">
        <h2> Original Brands ✔</h2>
        <div class="wrapper">
            <button class="btn" id="prev" onclick="slide('prev')">&#10094;</button>
            <div class="view-port">
                <div class="sliding-containor">
                    <div class="card">
                        <img src="https://images.meesho.com/images/marketing/1744635542873.webp" alt="Product">
                    </div>

                    <div class="card">
                        <img src="https://images.meesho.com/images/marketing/1744635521751.webp" alt="Product">
                    </div>

                    <div class="card">
                        <img src="https://images.meesho.com/images/marketing/1744635497001.webp" alt="Product">
                    </div>

                    <div class="card">
                        <img src="https://images.meesho.com/images/marketing/1744635464683.webp" alt="Product">
                    </div>

                    <div class="card">
                        <img src="https://images.meesho.com/images/marketing/1744635402151.webp" alt="Product">
                    </div>

                    <div class="card">
                        <img src="https://images.meesho.com/images/marketing/1744635614888.webp" alt="Product">
                    </div>

                    <div class="card">
                        <img src="https://images.meesho.com/images/marketing/1744635646070.webp" alt="Product">
                    </div>

                    <div class="card">
                        <img src="https://images.meesho.com/images/marketing/1744635542873.webp" alt="Product">
                    </div>
                </div>
            </div>
            <button class="btn" id="next" onclick="slide('next')">&#10095;</button>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
