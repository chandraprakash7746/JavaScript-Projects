<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav class="navigation">
        <h1>Kanban Board</h1>
        <button class="add-task-btn btn">Add new task</button>
      </nav>

      <section>
        <div id="todo" class="task-column ">
          <div class="heading">
            <div class="left">Todo</div>
            <div class="right">0</div>
          </div>
          <!-- <div draggable="true" class="task">
            <h1>Task 1</h1>
            <p>Description fortask 1</p>
            <button class="dltBtn btn">Delete</button>
          </div> -->
        </div>

        <div id="progress" class="task-column ">
          <div class="heading">
            <div class="left">Progress</div>
            <div class="right">0</div>
          </div>
          <!-- <div draggable="true" class="task">
            <h1>Task 1</h1>
            <p>Description fortask 1</p>
            <button class="dltBtn btn">Delete</button>
          </div> -->
          
        </div>

        <div id="done" class="task-column">
          <div class="heading">
            <div class="left">Done</div>
            <div class="right">0</div>
          </div>
          
        </div>
      </section>

      <div class="modal hide">
        <div class="modal-content">
          <input id="input" class="input-field" type="text" placeholder="Task Discription">
          <textarea id="text-area" class="input-field" type="text" placeholder="Task Title"></textarea>
          <button id="add-task-btn" class="btn">Add Task</button>
        </div>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
</html>
